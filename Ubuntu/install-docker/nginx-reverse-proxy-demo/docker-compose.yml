version: '3.8'

services:
  # Backend application instances for load balancing
  app1:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: nodejs-server-demo:latest
    container_name: demo-app1
    networks:
      - demo-network
    restart: unless-stopped
    environment:
      - PORT=3001
      - INSTANCE_NAME=App Instance 1
      - NODE_ENV=production
      - TZ=UTC
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  app2:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: nodejs-server-demo:latest
    container_name: demo-app2
    networks:
      - demo-network
    restart: unless-stopped
    environment:
      - PORT=3002
      - INSTANCE_NAME=App Instance 2
      - NODE_ENV=production
      - TZ=UTC
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  app3:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: nodejs-server-demo:latest
    container_name: demo-app3
    networks:
      - demo-network
    restart: unless-stopped
    environment:
      - PORT=3003
      - INSTANCE_NAME=App Instance 3
      - NODE_ENV=production
      - TZ=UTC
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx reverse proxy service
  nginx:
    image: nginx:alpine
    container_name: demo-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - demo-network
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  demo-network:
    driver: bridge
    name: demo-network
